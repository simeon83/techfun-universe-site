<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | TechFun Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-mark">TFU</span>Tech<span>Fun</span></a>
    <div class="nav-links"></div>
    <div class="nav-right">
      <a href="index.html" style="color:var(--text-dim);font-size:0.92rem;">← Back to site</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-icon">→]</div>
  <h1>Welcome back</h1>
  <p>Log in to your account</p>

  <div class="auth-card">
    <button type="button" class="btn-google">
      <span style="font-weight:800;">G</span> Continue with Google
    </button>
    <div class="divider">OR</div>

    <form id="loginForm">
      <div class="field" style="margin-bottom:18px;">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="field" style="margin-bottom:22px;">
        <div class="field-row-between">
          <label for="loginPassword" style="margin-bottom:0;">Password</label>
          <a href="#" class="link-orange">Forgot password?</a>
        </div>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
  </div>

  <p class="auth-footer">Don't have an account? <a href="#" class="link-orange">Create one</a></p>
</div>

<a class="whatsapp-fab btn btn-primary btn-sm" href="https://wa.me/231880880376?text=Hello%20TechFun%20Universe%2C%20I'm%20interested%20in%20your%20digital%20services." target="_blank" rel="noopener">WhatsApp</a>

<script src="js/main.js"></script>
</body>
</html>
