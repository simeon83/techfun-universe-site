backend:
  name: git-gateway
  branch: main

# If you're hosting on GitHub Pages instead of Netlify, replace the
# backend block above with:
# backend:
#   name: github
#   repo: your-username/your-repo-name
#   branch: main

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: editorial_workflow

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Web Development", "Mobile Apps", "Software", "AI", "Digital Marketing", "Branding", "Case Study"] }
      - { label: "Read Time", name: "read_time", widget: "string", default: "5 min read" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "Portfolio Projects"
    folder: "src/content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Website", value: "website" }
          - { label: "Mobile App", value: "app" }
          - { label: "Software", value: "software" }
          - { label: "Branding", value: "branding" }
          - { label: "AI Project", value: "ai" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Technologies Used", name: "technologies", widget: "string" }
      - { label: "Client Results", name: "results", widget: "text", required: false }
      - label: "Project Status"
        name: "status"
        widget: "select"
        required: false
        hint: "Be truthful — only use client-verified results for real, completed client work."
        options:
          - { label: "Demo Project", value: "Demo Project" }
          - { label: "Internal Product", value: "Internal Product" }
          - { label: "Concept Project", value: "Concept Project" }
          - { label: "Prototype", value: "Prototype" }
          - { label: "In Development", value: "In Development" }
          - { label: "Built by TechFun Universe", value: "Built by TechFun Universe" }
          - { label: "Available for Customization", value: "Available for Customization" }
          - { label: "Completed Client Project", value: "Completed Client Project" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Client Name", name: "name", widget: "string" }
      - { label: "Client Role / Company", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Display Order", name: "order", widget: "number", default: 1 }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Contact Information"
        name: "contact"
        file: "src/_data/contact.yml"
        fields:
          - { label: "Phone 1", name: "phone_1", widget: "string" }
          - { label: "Phone 2", name: "phone_2", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - { label: "Business Hours", name: "hours", widget: "text" }
      - label: "Homepage Stats"
        name: "stats"
        file: "src/_data/stats.yml"
        fields:
          - { label: "Projects Delivered", name: "projects", widget: "number" }
          - { label: "Happy Clients", name: "clients", widget: "number" }
          - { label: "Years Building", name: "years", widget: "number" }
      - label: "Pricing"
        name: "pricing"
        file: "src/_data/pricing.yml"
        fields:
          - label: "Website Packages"
            name: "website_packages"
            widget: "list"
            fields:
              - { label: "Package Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Featured / Most Popular", name: "featured", widget: "boolean", default: false }
              - { label: "Features", name: "features", widget: "list" }
